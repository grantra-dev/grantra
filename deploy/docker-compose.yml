# Local development stack. Credentials here are for development only.
#   docker compose -f deploy/docker-compose.yml up --build
name: grantra

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HEALTH_ENABLED: "true"
      # Browsers reach Keycloak on localhost:8081 and Grantra reaches it as
      # keycloak:8080. Tokens always carry the localhost issuer.
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/grantra-realm.json:/opt/keycloak/data/import/grantra-realm.json:ro
      # The Grantra Login theme; start-dev reloads it on every page view.
      - ./keycloak/themes/grantra:/opt/keycloak/themes/grantra:ro
    depends_on:
      postgres:
        condition: service_healthy

  grantra:
    build:
      context: ..
      dockerfile: core/Dockerfile
    environment:
      GRANTRA_DATABASE_URL: postgres://grantra_app:grantra@postgres:5432/grantra?sslmode=disable
      GRANTRA_LOG_LEVEL: debug
      GRANTRA_PUBLIC_URL: http://localhost:8080
      GRANTRA_OIDC_ISSUER: http://localhost:8081/realms/grantra
      GRANTRA_OIDC_DISCOVERY_URL: http://keycloak:8080/realms/grantra
      GRANTRA_OIDC_CLIENT_ID: grantra-console
      GRANTRA_OIDC_CLIENT_SECRET: grantra-dev-secret
      # Lets the realm's admin user sign in before any HR source is connected.
      GRANTRA_BOOTSTRAP_EMAIL: admin@grantra.local
      # Loads a sample company on first start; see docs/demo.md.
      GRANTRA_DEMO: "true"
      # The demo governs Grantra Login too, through the realm's
      # grantra-connector service account.
      GRANTRA_DEMO_LOGIN_URL: http://keycloak:8080
      GRANTRA_SECRET_GRANTRA_LOGIN: grantra-dev-connector-secret
      # Notification emails land in Mailpit: open http://localhost:8025.
      GRANTRA_SMTP_HOST: mailpit
      GRANTRA_SMTP_PORT: "1025"
      GRANTRA_SMTP_TLS: none
      GRANTRA_SMTP_FROM: Grantra <grantra@grantra.local>
      # The vault's master key. A fixed one is fine for the demo; generate
      # your own (openssl rand -base64 32) for anything real.
      GRANTRA_VAULT_KEY: Z3JhbnRyYS1kZW1vLXZhdWx0LWtleS0wMDAwMDAwMDA=
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # Catches every email Grantra sends, so nothing reaches a real inbox.
  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - "8025:8025"

volumes:
  pgdata:
