{{- $db := not .Values.database.existingSecret -}}
{{- $oidc := and (not .Values.oidc.existingSecret) .Values.oidc.clientSecret -}}
{{- $smtp := and (not .Values.smtp.existingSecret) .Values.smtp.password -}}
{{- $vault := and (not .Values.vault.existingSecret) .Values.vault.key -}}
{{- if or $db $oidc $smtp $vault }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "grantra.fullname" . }}
  labels:
    {{- include "grantra.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $db }}
  database-url: {{ include "grantra.databaseURL" . | quote }}
  migrate-database-url: {{ include "grantra.migrateDatabaseURL" . | quote }}
  {{- end }}
  {{- if $oidc }}
  oidc-client-secret: {{ .Values.oidc.clientSecret | quote }}
  {{- end }}
  {{- if $smtp }}
  smtp-password: {{ .Values.smtp.password | quote }}
  {{- end }}
  {{- if $vault }}
  vault-key: {{ .Values.vault.key | quote }}
  {{- end }}
{{- end }}
