{{- if .Values.postgresql.enabled }}
{{- $name := include "grantra.postgresql.host" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "grantra.labels" . | nindent 4 }}
type: Opaque
stringData:
  superuser-password: {{ required "postgresql.auth.superuserPassword is required" .Values.postgresql.auth.superuserPassword | quote }}
  owner-password: {{ required "postgresql.auth.ownerPassword is required" .Values.postgresql.auth.ownerPassword | quote }}
  app-password: {{ required "postgresql.auth.appPassword is required" .Values.postgresql.auth.appPassword | quote }}
  {{- if .Values.login.enabled }}
  login-password: {{ required "postgresql.auth.loginPassword is required with login.enabled" .Values.postgresql.auth.loginPassword | quote }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-init
  labels:
    {{- include "grantra.labels" . | nindent 4 }}
data:
  # Runs once, when the data volume is empty. grantra_owner owns the schema
  # and runs migrations; grantra_app is what the server connects as.
  init.sh: |
    #!/bin/sh
    set -eu
    psql -v ON_ERROR_STOP=1 -U postgres \
      -v owner_pw="$OWNER_PASSWORD" -v app_pw="$APP_PASSWORD" -v login_pw="${LOGIN_PASSWORD:-}" <<'SQL'
    CREATE ROLE grantra_owner LOGIN PASSWORD :'owner_pw';
    CREATE ROLE grantra_app LOGIN PASSWORD :'app_pw' NOSUPERUSER NOBYPASSRLS;
    CREATE DATABASE grantra OWNER grantra_owner;
    \connect grantra
    ALTER SCHEMA public OWNER TO grantra_owner;
    REVOKE CREATE ON SCHEMA public FROM PUBLIC;
    SELECT :'login_pw' <> '' AS with_login \gset
    \if :with_login
    CREATE ROLE keycloak LOGIN PASSWORD :'login_pw';
    CREATE DATABASE keycloak OWNER keycloak;
    \endif
    SQL
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "grantra.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "grantra.labels" . | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70  # postgres in the alpine image
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: {{ printf "%s:%s" .Values.postgresql.image.repository .Values.postgresql.image.tag }}
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ $name }}, key: superuser-password}
            - name: OWNER_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ $name }}, key: owner-password}
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ $name }}, key: app-password}
            {{- if .Values.login.enabled }}
            - name: LOGIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ $name }}, key: login-password}
            {{- end }}
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -U, postgres]
            periodSeconds: 5
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: init
          configMap:
            name: {{ $name }}-init
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgresql.storage.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.storage.size }}
{{- end }}
