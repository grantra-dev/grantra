apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "grantra.fullname" . }}
  labels:
    {{- include "grantra.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "grantra.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "grantra.selector" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "grantra.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "grantra.podSecurity" . | nindent 8 }}
      initContainers:
        # Applies migrations as the role that owns the tables, then grants the
        # server's role data permissions only. Replicas starting together
        # queue on a lock, so this is safe with any replica count. The owner
        # credentials reach this container only.
        - name: migrate
          image: {{ include "grantra.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [migrate]
          env:
            - name: GRANTRA_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "grantra.databaseSecret" . }}
                  key: database-url
            - name: GRANTRA_MIGRATE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "grantra.databaseSecret" . }}
                  key: migrate-database-url
            - name: GRANTRA_PUBLIC_URL
              value: {{ .Values.publicURL | quote }}
          securityContext:
            {{- include "grantra.containerSecurity" . | nindent 12 }}
      containers:
        - name: grantra
          image: {{ include "grantra.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: GRANTRA_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "grantra.databaseSecret" . }}
                  key: database-url
            - name: GRANTRA_MIGRATE_ON_START
              value: "false"
            - name: GRANTRA_PUBLIC_URL
              value: {{ .Values.publicURL | quote }}
            - name: GRANTRA_TENANT
              value: {{ .Values.tenant.slug | quote }}
            - name: GRANTRA_TENANT_NAME
              value: {{ .Values.tenant.name | quote }}
            - name: GRANTRA_LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            {{- with .Values.bootstrapEmail }}
            - name: GRANTRA_BOOTSTRAP_EMAIL
              value: {{ . | quote }}
            {{- end }}
            {{- with include "grantra.oidcIssuer" . }}
            - name: GRANTRA_OIDC_ISSUER
              value: {{ . | quote }}
            - name: GRANTRA_OIDC_CLIENT_ID
              value: {{ $.Values.oidc.clientId | quote }}
            {{- if or $.Values.oidc.existingSecret $.Values.oidc.clientSecret }}
            - name: GRANTRA_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "grantra.oidcSecret" $ }}
                  key: oidc-client-secret
            {{- end }}
            {{- end }}
            {{- with .Values.smtp }}
            {{- if .host }}
            - name: GRANTRA_SMTP_HOST
              value: {{ .host | quote }}
            - name: GRANTRA_SMTP_PORT
              value: {{ .port | quote }}
            - name: GRANTRA_SMTP_TLS
              value: {{ .tls | quote }}
            - name: GRANTRA_SMTP_FROM
              value: {{ required "smtp.from is required when smtp.host is set" .from | quote }}
            {{- if .username }}
            - name: GRANTRA_SMTP_USERNAME
              value: {{ .username | quote }}
            - name: GRANTRA_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "grantra.smtpSecret" $ }}
                  key: smtp-password
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if .Values.gateway.enabled }}
            {{- with .Values.gateway.publicAddress }}
            - name: GRANTRA_SSH_GATEWAY_ADDRESS
              value: {{ . | quote }}
            {{- end }}
            {{- $host := regexReplaceAll ":[0-9]+$" .Values.gateway.publicAddress "" }}
            {{- range $kind, $port := .Values.gateway.ports }}
            {{- $addr := index $.Values.gateway.publicAddresses $kind }}
            {{- if and $port (not $addr) $host }}
            {{- $addr = printf "%s:%v" $host $port }}
            {{- end }}
            {{- if and $port $addr }}
            - name: GRANTRA_GATEWAY_{{ upper $kind }}_ADDRESS
              value: {{ $addr | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.gateway.tls.existingSecret }}
            # Handed out in the console: clients verify the gateway with it.
            - name: GRANTRA_GATEWAY_CA_FILE
              value: /etc/grantra-gateway-tls/ca.crt
            {{- end }}
            {{- end }}
            {{- if .Values.desktops.enabled }}
            - name: GRANTRA_GUACD_ADDR
              value: {{ printf "%s-guacd:4822" (include "grantra.fullname" .) | quote }}
            - name: GRANTRA_RDP_MAX_RECORDING_MB
              value: {{ .Values.desktops.maxRecordingMB | quote }}
            {{- end }}
            {{- include "grantra.vaultEnv" . | nindent 12 }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.envFromSecrets }}
          envFrom:
            {{- range . }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # Large uploads (HR files) spill to disk.
            - name: tmp
              mountPath: /tmp
            {{- if and .Values.gateway.enabled .Values.gateway.tls.existingSecret }}
            - name: gateway-ca
              mountPath: /etc/grantra-gateway-tls
              readOnly: true
            {{- end }}
            {{- with .Values.vault.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            {{- include "grantra.containerSecurity" . | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if and .Values.gateway.enabled .Values.gateway.tls.existingSecret }}
        # Only the CA: the server never holds the gateway's key.
        - name: gateway-ca
          secret:
            secretName: {{ .Values.gateway.tls.existingSecret }}
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
        {{- with .Values.vault.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
