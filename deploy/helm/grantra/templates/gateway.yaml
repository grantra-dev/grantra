{{- if .Values.gateway.enabled }}
{{- if not (or .Values.vault.existingSecret .Values.vault.key .Values.vault.provider) }}
{{- fail "gateway.enabled needs vault.key, vault.existingSecret or vault.provider: the gateway signs with the SSH certificate authority that key seals" }}
{{- end }}
{{- $name := printf "%s-gateway" (include "grantra.fullname" .) }}
{{- $ports := .Values.gateway.ports }}
{{- $names := .Values.gateway.tls.names }}
{{- if not $names }}
{{- $names = list (printf "%s.%s.svc" $name .Release.Namespace) $name }}
{{- with .Values.gateway.publicAddress }}
{{- $names = prepend $names (regexReplaceAll ":[0-9]+$" . "") }}
{{- end }}
{{- end }}
{{- if not .Values.gateway.hostKey.existingSecret }}
{{- $secret := include "grantra.gatewayHostKeySecret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret }}
  labels:
    {{- include "grantra.labels" . | nindent 4 }}
  annotations:
    # Losing the host key makes every client warn, so it outlives the release.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing (index $existing.data "host-key") }}
  host-key: {{ index $existing.data "host-key" }}
  {{- else }}
  host-key: {{ genPrivateKey "ed25519" | b64enc }}
  {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "grantra.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: grantra-gateway
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grantra-gateway
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "grantra.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.gateway.kubernetes.inCluster }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "grantra.podSecurity" . | nindent 8 }}
        # The image's nonroot group, so it can read the mounted host key.
        fsGroup: 65532
      containers:
        - name: gateway
          image: {{ include "grantra.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [gateway]
          ports:
            - name: ssh
              containerPort: 2222
            {{- range $kind, $port := $ports }}
            {{- if $port }}
            - name: {{ $kind | trunc 15 }}
              containerPort: {{ $port }}
            {{- end }}
            {{- end }}
          env:
            - name: GRANTRA_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "grantra.databaseSecret" . }}
                  key: database-url
            - name: GRANTRA_PUBLIC_URL
              value: {{ .Values.publicURL | quote }}
            - name: GRANTRA_TENANT
              value: {{ .Values.tenant.slug | quote }}
            - name: GRANTRA_TENANT_NAME
              value: {{ .Values.tenant.name | quote }}
            - name: GRANTRA_LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: GRANTRA_GATEWAY_ADDR
              value: ":2222"
            - name: GRANTRA_GATEWAY_HOST_KEY_FILE
              value: /etc/grantra-gateway/host-key
            - name: GRANTRA_GATEWAY_KUBERNETES_ADDR
              value: {{ if $ports.kubernetes }}{{ printf ":%v" $ports.kubernetes | quote }}{{ else }}"off"{{ end }}
            - name: GRANTRA_GATEWAY_POSTGRES_ADDR
              value: {{ if $ports.postgres }}{{ printf ":%v" $ports.postgres | quote }}{{ else }}"off"{{ end }}
            - name: GRANTRA_GATEWAY_MYSQL_ADDR
              value: {{ if $ports.mysql }}{{ printf ":%v" $ports.mysql | quote }}{{ else }}"off"{{ end }}
            {{- if .Values.gateway.tls.existingSecret }}
            - name: GRANTRA_GATEWAY_TLS_CERT_FILE
              value: /etc/grantra-gateway-tls/tls.crt
            - name: GRANTRA_GATEWAY_TLS_KEY_FILE
              value: /etc/grantra-gateway-tls/tls.key
            {{- else }}
            - name: GRANTRA_GATEWAY_TLS_NAMES
              value: {{ join "," $names | quote }}
            {{- end }}
            {{- include "grantra.vaultEnv" . | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: ssh
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: ssh
            periodSeconds: 5
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          volumeMounts:
            - name: host-key
              mountPath: /etc/grantra-gateway
              readOnly: true
            {{- if .Values.gateway.tls.existingSecret }}
            - name: tls
              mountPath: /etc/grantra-gateway-tls
              readOnly: true
            {{- end }}
            {{- with .Values.vault.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            {{- include "grantra.containerSecurity" . | nindent 12 }}
      volumes:
        - name: host-key
          secret:
            secretName: {{ include "grantra.gatewayHostKeySecret" . }}
            defaultMode: 0440
        {{- with .Values.gateway.tls.existingSecret }}
        - name: tls
          secret:
            secretName: {{ . }}
            defaultMode: 0440
        {{- end }}
        {{- with .Values.vault.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "grantra.labels" . | nindent 4 }}
  {{- with .Values.gateway.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.gateway.service.type }}
  selector:
    app.kubernetes.io/name: grantra-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: ssh
      port: {{ .Values.gateway.service.port }}
      targetPort: ssh
    {{- range $kind, $port := $ports }}
    {{- if $port }}
    - name: {{ $kind }}
      port: {{ $port }}
      targetPort: {{ $kind | trunc 15 }}
    {{- end }}
    {{- end }}
{{- if .Values.gateway.kubernetes.inCluster }}
---
# The gateway acts as the person on the cluster it runs in: it may
# impersonate users, groups and its own two extras, and nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}-impersonate
  labels:
    {{- include "grantra.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [users, groups]
    verbs: [impersonate]
  - apiGroups: [authentication.k8s.io]
    resources: [userextras/grantra-identity, userextras/grantra-session]
    verbs: [impersonate]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}-impersonate
  labels:
    {{- include "grantra.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}-impersonate
subjects:
  - kind: ServiceAccount
    name: {{ include "grantra.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
