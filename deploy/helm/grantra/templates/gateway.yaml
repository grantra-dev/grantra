{{- if .Values.gateway.enabled }}
{{- if not (or .Values.vault.existingSecret .Values.vault.key .Values.vault.provider) }}
{{- fail "gateway.enabled needs vault.key, vault.existingSecret or vault.provider: the gateway signs with the SSH certificate authority that key seals" }}
{{- end }}
{{- $name := printf "%s-gateway" (include "grantra.fullname" .) }}
{{- if not .Values.gateway.hostKey.existingSecret }}
{{- $secret := include "grantra.gatewayHostKeySecret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret }}
  labels:
    {{- include "grantra.labels" . | nindent 4 }}
  annotations:
    # Losing the host key makes every client warn, so it outlives the release.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing (index $existing.data "host-key") }}
  host-key: {{ index $existing.data "host-key" }}
  {{- else }}
  host-key: {{ genPrivateKey "ed25519" | b64enc }}
  {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "grantra.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: grantra-gateway
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grantra-gateway
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "grantra.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "grantra.podSecurity" . | nindent 8 }}
        # The image's nonroot group, so it can read the mounted host key.
        fsGroup: 65532
      containers:
        - name: gateway
          image: {{ include "grantra.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [gateway]
          ports:
            - name: ssh
              containerPort: 2222
          env:
            - name: GRANTRA_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "grantra.databaseSecret" . }}
                  key: database-url
            - name: GRANTRA_PUBLIC_URL
              value: {{ .Values.publicURL | quote }}
            - name: GRANTRA_TENANT
              value: {{ .Values.tenant.slug | quote }}
            - name: GRANTRA_TENANT_NAME
              value: {{ .Values.tenant.name | quote }}
            - name: GRANTRA_LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: GRANTRA_GATEWAY_ADDR
              value: ":2222"
            - name: GRANTRA_GATEWAY_HOST_KEY_FILE
              value: /etc/grantra-gateway/host-key
            {{- include "grantra.vaultEnv" . | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: ssh
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: ssh
            periodSeconds: 5
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          volumeMounts:
            - name: host-key
              mountPath: /etc/grantra-gateway
              readOnly: true
          securityContext:
            {{- include "grantra.containerSecurity" . | nindent 12 }}
      volumes:
        - name: host-key
          secret:
            secretName: {{ include "grantra.gatewayHostKeySecret" . }}
            defaultMode: 0440
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "grantra.labels" . | nindent 4 }}
  {{- with .Values.gateway.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.gateway.service.type }}
  selector:
    app.kubernetes.io/name: grantra-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: ssh
      port: {{ .Values.gateway.service.port }}
      targetPort: ssh
{{- end }}
