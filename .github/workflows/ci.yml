name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      # The database gateway's MySQL tests log in to it.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mysql
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pmysql"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
    env:
      GRANTRA_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      GRANTRA_TEST_MYSQL_DSN: root:mysql@tcp(127.0.0.1:3306)/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...
      - name: Test HSM keys (SoftHSM)
        env:
          GRANTRA_TEST_PKCS11_MODULE: /usr/lib/softhsm/libsofthsm2.so
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q softhsm2
          CGO_ENABLED=1 go vet -tags pkcs11 ./internal/vault/kms/
          CGO_ENABLED=1 go test -tags pkcs11 -count=1 -v -run PKCS11 ./internal/vault/kms/
      - name: Build
        run: go build ./cmd/grantra
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: Lint
        run: helm lint deploy/helm/grantra --set database.existingSecret=grantra-db
      - name: Render
        run: |
          helm template t deploy/helm/grantra --set database.existingSecret=grantra-db > /dev/null
          helm template t deploy/helm/grantra \
            --set postgresql.enabled=true,postgresql.auth.superuserPassword=s,postgresql.auth.ownerPassword=o,postgresql.auth.appPassword=a \
            --set postgresql.auth.loginPassword=l,login.enabled=true,login.admin.password=p,login.ingress.enabled=true,ingress.enabled=true,vault.key=k,gateway.enabled=true > /dev/null
          helm template t deploy/helm/grantra --set database.existingSecret=grantra-db \
            --set vault.provider=transit,vault.kmsKey=grantra,gateway.enabled=true > /dev/null
          helm template t deploy/helm/grantra --set database.existingSecret=grantra-db,vault.key=k,gateway.enabled=true \
            --set gateway.publicAddress=gw.example.com:2222,gateway.kubernetes.inCluster=true,gateway.ports.mysql=0 > /dev/null
          helm template t deploy/helm/grantra --set database.existingSecret=grantra-db,vault.key=k,gateway.enabled=true \
            --set gateway.tls.existingSecret=gw-tls > /dev/null
          helm template t deploy/helm/grantra --set database.existingSecret=grantra-db,vault.key=k,desktops.enabled=true > /dev/null

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f core/Dockerfile -t grantra:ci .
      - name: Build Grantra Login image
        run: docker build -t grantra-login:ci deploy/keycloak
