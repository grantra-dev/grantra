# Publishes a release when a version tag (v1.2.3) is pushed: multi-arch
# container images (Grantra, and Grantra Login with its theme) and binaries, each signed with Sigstore cosign (keyless,
# through GitHub's OIDC identity) and shipped with an SPDX SBOM.
# docs/releases.md explains how to verify them.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: grantra
            context: .
            file: core/Dockerfile
          - name: grantra-login
            context: deploy/keycloak
            file: deploy/keycloak/Dockerfile
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: sigstore/cosign-installer@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          # BuildKit SBOM and provenance attestations, stored with the image.
          sbom: true
          provenance: mode=max
      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: ${{ matrix.name }}-image.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Sign the image and attach the SBOM
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type spdxjson --predicate ${{ matrix.name }}-image.spdx.json "$REF"

  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # keyless cosign signing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: sigstore/cosign-installer@v3
      - name: Build the web console
        run: |
          cd web && npm ci && npm run build
          cp -R dist/. ../core/internal/webui/dist/
      - name: Build binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*} arch=${target#*/}
            name=grantra_${VERSION#v}_${os}_${arch}
            ext=""; [ "$os" = windows ] && ext=.exe
            (cd core && CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/grantra-dev/grantra/core/internal/server.Version=${VERSION}" \
              -o "../dist/$name/grantra$ext" ./cmd/grantra)
            cp LICENSE README.md "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
            rm -r "dist/$name"
          done
      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          path: core
          format: spdx-json
          output-file: dist/grantra.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Checksums and signature
        run: |
          cd dist
          sha256sum *.tar.gz grantra.spdx.json > checksums.txt
          cosign sign-blob --yes --bundle checksums.txt.sigstore.json checksums.txt
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --title "$TAG" --generate-notes --verify-tag
